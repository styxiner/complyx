services:
  complyx-database:
    image: postgres:18-alpine
    container_name: complyx-database
    restart: no
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  complyx-server:
    build: https://github.com/styxiner/complyx-server.git#v0.1.0
    container_name: complyx-server
    restart: no
    environment:
      COMPLYX_DATABASE_URL: postgres://${DATABASE_USER}:${DATABASE_PASSWORD}@complyx-database/${DATABASE_NAME}
      COMPLYX_SERVER_HOSTNAMES: "complyx-server,localhost,127.0.0.1"
    ports:
      - "9000:9000"
      - "9001:9001"
    depends_on:
      complyx-database:
        condition: service_healthy
    volumes:
      - pki_data:/var/lib/complyx/pki
      - ./config/server.toml:/etc/complyx/server.toml:ro
    healthcheck:
      test:
        ["CMD-SHELL", "nc -z 127.0.0.1 9000 && nc -z 127.0.0.1 9001 || exit 1"]
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 5

  complyx-api:
    build: https://github.com/styxiner/complyx-api.git#v0.1.0
    container_name: complyx-api
    restart: no
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://complyx-database:5432/${DATABASE_NAME}
      SPRING_DATASOURCE_USERNAME: ${DATABASE_USER}
      SPRING_DATASOURCE_PASSWORD: ${DATABASE_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      JWT_SECRET: ${JWT_SECRET}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
    ports:
      - "8080:8080"
    mem_limit: 4g
    cpus: "2.0"
    read_only: true
    tmpfs:
      - /tmp
    depends_on:
      complyx-database:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD-SHELL", "nc -z 127.0.0.1 8080 || exit 1"]
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 5

  complyx-ui:
    build: https://github.com/styxiner/complyx-ui.git#v0.1.0
    container_name: complyx-ui
    restart: no
    environment:
      - BACKEND_URL=http://complyx-api:8080
    ports:
      - "4200:80"
    depends_on:
      complyx-api:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD-SHELL", "nc -z 127.0.0.1 80 || nz -z 127.0.0.1 4200 || exit 1"]
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 5

volumes:
  postgres_data:
  pki_data:
